  wrHome=function(){
    app.innerHTML=`
    <section class="hero hero-v2">
      <div>

        <h1>Weniger Zettel, weniger Überschlagen. Mehr Klarheit bei jedem Auftrag.</h1>
        <p>Du willst morgens auf der Baustelle schnell Materialmengen prüfen, mittags einen Preis kalkulieren und abends Leistungen sauber dokumentieren – ohne für jede Kleinigkeit eine neue Excel-Datei zu öffnen. WerkRechner bündelt genau diese wiederkehrenden Aufgaben in einfachen, kostenlosen Werkzeugen.</p>
        <div class="btn-row"><a class="btn" href="#tools">Passendes Tool finden</a><a class="btn secondary" href="#tool/stundenverrechnungssatz-rechner">Stundensatz berechnen</a></div>

      </div>
      <div class="hero-panel">
        <span class="pill">Schnelleinstieg</span>
        <h2>Was steht gerade an?</h2>
        <p class="muted">Starte nicht bei einer Kategorie, sondern bei der Aufgabe, die du gerade lösen musst.</p>
        <div class="quick-links"><a href="#tool/angebotskalkulator">Angebot kalkulieren</a><a href="#tool/fliesenrechner">Material berechnen</a><a href="#tool/bautagesbericht-generator">Baustelle dokumentieren</a><a href="#tool/stundenverrechnungssatz-rechner">Stundensatz prüfen</a><a href="#tool/rapportzettel-generator">Rapport erstellen</a></div>
      </div>
    </section>
    <section class="trust-strip"><div><strong>28</strong><span>aktive Rechner & Generatoren</span></div><div><strong>5</strong><span>Aufgabenbereiche</span></div><div><strong>0 €</strong><span>für Kernfunktionen</span></div><div><strong>1 Ziel</strong><span>schneller zur nächsten Entscheidung</span></div></section>

    <section class="section">

      <div class="pain-grid">
        <div class="problem-card"><span class="mini">Kalkulation</span><h3>„Was muss ich pro Stunde eigentlich verlangen?“</h3><p>Bruttolohn allein sagt fast nichts über deinen nötigen Verrechnungssatz. Produktive Stunden, Gemeinkosten und Gewinn müssen zusammenpassen.</p><a href="#tool/stundenverrechnungssatz-rechner">Verrechnungssatz berechnen →</a></div>
        <div class="problem-card"><span class="mini">Material</span><h3>„Wie viel muss ich wirklich bestellen?“</h3><p>Nettofläche, Verschnitt, Packungsgrößen und Reserve werden schnell durcheinandergebracht. Unsere Mengenrechner trennen die Schritte.</p><a href="#tool/fliesenrechner">Mit dem Fliesenrechner starten →</a></div>

      </div>
    </section>

    <section class="section">

      <div class="day-flow">
        <div class="day-step"><b>07:30 · Baustelle</b><h3>Maße & Mengen prüfen</h3><p>Aufmaß, Wandflächen, Beton, Fliesen, Estrich oder Farbe direkt am Handy überschlagen.</p><a class="text-link" href="#tool/aufmass-rechner">Aufmaß öffnen →</a></div>
        <div class="day-step"><b>13:00 · Büro / Fahrzeug</b><h3>Kosten & Angebot kalkulieren</h3><p>Arbeitszeit, Material, Anfahrt und Marge nachvollziehbar zu einem Preis zusammenführen.</p><a class="text-link" href="#tool/angebotskalkulator">Angebot kalkulieren →</a></div>
        <div class="day-step"><b>17:00 · Feierabend</b><h3>Leistung dokumentieren</h3><p>Rapport, Regiearbeit, Tagesbericht oder Mängel sauber festhalten und als PDF sichern.</p><a class="text-link" href="#tool/rapportzettel-generator">Rapport erstellen →</a></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><div><span class="section-kicker">Für wen?</span><h2>Gebaut für Menschen, die rechnen müssen – nicht für Controller.</h2></div><p>Die Oberfläche bleibt bewusst einfach. Keine komplizierten Dashboards, solange ein paar klare Eingaben und ein verständliches Ergebnis reichen.</p></div>
      <div class="target-grid">
        <div class="target-card"><h3>Inhaber & Meister</h3><p>Wenn Angebote wirtschaftlich sein müssen und du wissen willst, ob dein Stundensatz, Materialaufschlag oder Projektpreis noch passt.</p><ul><li>Verrechnungssatz</li><li>Mitarbeiterkosten</li><li>Deckungsbeitrag</li><li>Angebotskalkulation</li></ul><a class="text-link" href="#tool/stundenverrechnungssatz-rechner">Kalkulation starten →</a></div>
        <div class="target-card"><h3>Bauleiter, Monteure & Teams</h3><p>Wenn draußen schnell gerechnet, aufgemessen oder dokumentiert werden muss und dafür kein Laptop aufgeklappt werden soll.</p><ul><li>Aufmaß</li><li>Bautagesbericht</li><li>Rapportzettel</li><li>Mängelprotokoll</li></ul><a class="text-link" href="#tool/bautagesbericht-generator">Baustellen-Tools öffnen →</a></div>
        <div class="target-card"><h3>Renovierer & Heimwerker</h3><p>Wenn du Material nicht nach Gefühl kaufen möchtest, sondern Fläche, Reserve und Verbrauch transparent berechnen willst.</p><ul><li>Fliesen</li><li>Farbe</li><li>Tapeten</li><li>Terrassenmaterial</li></ul><a class="text-link" href="#tool/wandflaechen-rechner">Renovierung planen →</a></div>
      </div>
    </section>

    <section class="section">

      <div class="trade-grid">
        <div class="trade-card"><span class="mini">Fliesen & Ausbau</span><h3>Fläche → Reserve → Fugen → Kosten</h3><p>Vom Aufmaß bis zur Materialkalkulation in einer logischen Kette.</p><a href="#tool/fliesenrechner">Fliesen-Workflow →</a></div>
        <div class="trade-card"><span class="mini">Maler & Renovierung</span><h3>Wandfläche → Verbrauch → Kosten</h3><p>Wandfläche berechnen und direkt in Farb- oder Materialbedarf weiterdenken.</p><a href="#tool/wandflaechen-rechner">Maler-Workflow →</a></div>
        <div class="trade-card"><span class="mini">Bau & Rohbau</span><h3>Volumen → Reserve → Dokumentation</h3><p>Beton, Estrich, Mörtel und Baustellenberichte für wiederkehrende Aufgaben.</p><a href="#tool/betonrechner">Bau-Tools →</a></div>
        <div class="trade-card"><span class="mini">Service & Montage</span><h3>Zeit → Anfahrt → Rapport → Angebot</h3><p>Fahrt, Arbeitszeit und Leistung so zusammenführen, dass der Auftrag nachvollziehbar bleibt.</p><a href="#tool/anfahrtskosten-rechner">Service-Workflow →</a></div>
      </div>
    </section>

    <section class="section workflow-section"><div class="section-head"><div><span class="section-kicker">Werkzeugketten</span><h2>Ein Ergebnis wird zum nächsten sinnvollen Schritt.</h2></div><p>Keine künstlichen Klickstrecken: Jeder Link darunter löst eine Aufgabe, die typischerweise direkt danach kommt.</p></div><div class="workflow-grid"><div class="workflow-card"><span>01</span><h3>Fliesenprojekt</h3><p>Aufmaß → Fliesen → Verschnitt → Fugenmasse → Materialkosten</p><a href="#tool/aufmass-rechner">Mit Aufmaß starten →</a></div><div class="workflow-card"><span>02</span><h3>Angebot</h3><p>Mitarbeiterkosten → Verrechnungssatz → Material → Angebot → Deckungsbeitrag</p><a href="#tool/mitarbeiterkosten-rechner">Kostenkette starten →</a></div><div class="workflow-card"><span>03</span><h3>Renovierung</h3><p>Wandfläche → Farbe/Tapete → Material → Projektkosten</p><a href="#tool/wandflaechen-rechner">Renovierung starten →</a></div><div class="workflow-card"><span>04</span><h3>Baustelle</h3><p>Tagesbericht → Rapport → Aufmaß → Abnahme/Mängel</p><a href="#tool/bautagesbericht-generator">Dokumentation starten →</a></div></div></section>

    <section class="section"><div class="section-head"><div><span class="section-kicker">Beliebt</span><h2>Diese Werkzeuge lösen besonders häufige Aufgaben.</h2></div><a class="text-link" href="#tools">Alle 28 Tools →</a></div>${cards(TOOLS.filter(t=>['stundenverrechnungssatz-rechner','fliesenrechner','betonrechner','angebotskalkulator','rapportzettel-generator','farbverbrauch-rechner'].includes(t.slug)))}</section>

    <section class="section"><div class="quality-panel"><div><span class="section-kicker">Transparenz statt Scheingenauigkeit</span><h2>Du sollst nicht nur eine Zahl bekommen, sondern verstehen, wo sie herkommt.</h2><p>Ein Rechner kann Herstellerdaten, Vertragsbedingungen oder jeden Sonderfall nicht kennen. Deshalb zeigen wir Annahmen, Rechenweg und Grenzen – und sagen ausdrücklich, wann du mit realen Produkt- oder Projektdaten weiterrechnen solltest.</p><a class="btn secondary" href="#methodik">Unsere Methodik ansehen</a></div><div class="quality-list"><div><strong>1</strong><span>Eingaben selbst festlegen</span></div><div><strong>2</strong><span>Ergebnis nachvollziehen</span></div><div><strong>3</strong><span>Grenzen erkennen</span></div><div><strong>4</strong><span>Direkt weiterarbeiten</span></div></div></div></section>

    <section class="section"><div class="section-head"><div><span class="section-kicker">Praxiswissen</span><h2>Wenn ein Rechner allein nicht reicht.</h2></div><a class="text-link" href="#guides">Alle Ratgeber →</a></div><div class="grid">${WR_GUIDES.slice(0,6).map(g=>`<div class="card"><h3>${g[0]}</h3><p class="muted">${g[1]}</p></div>`).join('')}</div></section>

    <section class="section"><div class="cta-band"><div><span class="section-kicker">Direkt loslegen</span><h2>Welche Aufgabe kostet dich gerade Zeit?</h2><p>Wähle das passende Tool, berechne den ersten Wert und springe anschließend direkt zum nächsten sinnvollen Schritt.</p></div><div class="btn-row"><a class="btn" href="#tools">Alle Tools öffnen</a><a class="btn secondary" href="#tool/angebotskalkulator">Angebot kalkulieren</a></div></div></section>

    <section class="section faq"><h2>Häufige Fragen</h2><details><summary>Muss ich mich anmelden?</summary><p>Nein. Die Kernfunktionen sind ohne Benutzerkonto nutzbar.</p></details><details><summary>Sind die Rechner nur für Betriebe?</summary><p>Nein. Kalkulations- und Dokumenttools richten sich stärker an Handwerksbetriebe, Material- und Renovierungsrechner sind auch für private Projekte sinnvoll.</p></details><details><summary>Warum gibt es Hinweise unter den Ergebnissen?</summary><p>Weil allgemeine Rechner projektspezifische Hersteller-, Norm- oder Vertragsvorgaben nicht kennen können.</p></details><details><summary>Wie finanziert sich WerkRechner später?</summary><p>Geplant ist klar getrennte Werbung. Die Kernfunktion soll unabhängig davon vollständig nutzbar bleiben.</p></details></section>`;
