<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WerkRechner – vollständige Preview</title><link rel="stylesheet" href="./styles.css"><style>.main-nav a:focus-visible,.menu-btn:focus-visible,.btn:focus-visible{outline:3px solid rgba(31,107,67,.28);outline-offset:3px}.menu-btn{width:44px;height:44px;align-items:center;justify-content:center}.hero-points{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:18px;color:var(--muted);font-size:.92rem}.quick-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.quick-links a{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:750;font-size:.84rem}.trust-strip{display:grid;grid-template-columns:repeat(4,1fr);background:#173f2c;color:#fff;border-radius:22px;overflow:hidden;margin:18px 0 54px}.trust-strip div{padding:20px;border-right:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:3px}.trust-strip strong{font-size:1.35rem}.trust-strip span{font-size:.82rem;color:rgba(255,255,255,.78)}.section-head{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;margin-bottom:18px}.section-head>p{max-width:430px;color:var(--muted);margin:0}.section-kicker{font-size:.77rem;text-transform:uppercase;letter-spacing:.12em;font-weight:850;color:var(--brand)}.text-link,.workflow-card a{color:var(--brand);font-weight:800}.workflow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.workflow-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.workflow-card>span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-weight:850;font-size:.78rem}.quality-panel{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;background:#173f2c;color:#fff;border-radius:24px;padding:32px}.quality-panel p{color:rgba(255,255,255,.78)}.quality-panel .section-kicker{color:#a8dabd}.quality-panel .btn.secondary{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}.quality-list{display:grid;gap:10px}.quality-list div{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;background:rgba(255,255,255,.08);padding:12px;border-radius:12px}.quality-list strong{display:grid;place-items:center;width:32px;height:32px;background:#fff;color:#173f2c;border-radius:9px}@media(max-width:800px){.menu-btn{display:flex}.site-header.open nav{top:64px;left:10px;right:10px;padding:10px}.site-header.open nav a{padding:12px 10px}body.menu-open{overflow:hidden}.hero-points{flex-direction:column;gap:6px}.trust-strip{grid-template-columns:1fr 1fr}.workflow-grid,.quality-panel{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column;gap:8px}.quality-panel{padding:22px}}</style></head><body><header class="site-header"><a class="brand" href="#home">Werk<span>Rechner</span></a><nav id="main-nav" class="main-nav"><a href="#tools">Tools</a><a href="#guides">Ratgeber</a><a href="#about">Über uns</a><a href="#methodik">Methodik</a></nav><button type="button" aria-controls="main-nav" aria-expanded="false" aria-label="Menü öffnen" class="menu-btn">☰</button></header><main id="app"></main><footer><div><strong>WerkRechner</strong><p>Statische Vorschau · noindex · keine Werbung.</p></div><div><a href="#tools">Tools</a><a href="#guides">Ratgeber</a><a href="#about">Über uns</a><a href="#methodik">Methodik</a></div><div><span>Produktionsversion erhält Impressum, Datenschutz und CMP auf eigener Domain.</span></div></footer><script src="./app.js"></script><script src="./enhancements.js"></script></body></html>
