ent:center;gap:8px;padding:12px 16px;border:0;border-radius:12px;font-weight:800;cursor:pointer;background:var(--brand);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.trust{display:grid;grid-template-columns:repeat(4,1fr);background:#173f2c;color:#fff;border-radius:20px;overflow:hidden;margin:14px 0 44px}.trust div{padding:18px;border-right:1px solid rgba(255,255,255,.14)}.trust strong{display:block;font-size:1.3rem}.trust span{font-size:.82rem;opacity:.78}.section{margin-top:48px}.section h2{font-size:clamp(1.6rem,3vw,2.5rem);letter-spacing:-.035em;margin:0 0 12px}.section-head{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:18px}.section-head p{max-width:520px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.content-box,.tool-box,.result-card,.search-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:20px;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(20,32,25,.10)}.card h3{margin:8px 0}.muted{color:var(--muted)}.search-panel{padding:22px;margin:20px 0 34px}.search-wrap{position:relative}.search-wrap input{width:100%;padding:16px 18px;border:1px solid #cbd3cc;border-radius:14px;background:#fff;font-size:1rem}.search-results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.search-item{display:flex;justify-content:space-between;gap:14px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfcfa}.search-item small{display:block;color:var(--muted)}.story{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;margin:52px 0}.story.reverse .story-img{order:2}.story-img{border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}.story-img img{display:block;width:100%;aspect-ratio:4/3;object- background:rgba(10,20,14,.34);z-index:80;display:none}.drawer.open{display:block}.drawer-panel{position:absolute;left:12px;right:12px;bottom:80px;background:#fff;border-radius:20px;padding:16px;max-height:70vh;overflow:auto}.empty{padding:18px;color:var(--muted);text-align:center}.favorite-btn{margin-left:8px}.workflow-progress{display:flex;gap:8px;overflow:auto;padding:10px 0 3px}.workflow-progress span{white-space:nowrap;padding:8px 10px;border-radius:999px;background:#eef0ec;font-size:.82rem}.workflow-progress span.active{background:var(--brand);color:#fff}.note{padding:14px 16px;background:#f2f8f4;border-left:4px solid var(--brand);border-radius:0 12px 12px 0;margin:14px 0}footer{max-width:1160px;margin:auto;padding:38px 20px;border-top:1px solid var(--line);color:var(--muted);display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}footer a{display:block;margin:6px 0}@media(max-width:800px){nav{display:none}.site-header.open nav{display:flex;position:absolute;top:65px;left:10px;right:10px;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}.menu-btn{display:block}.hero,.story,.grid,.guide-list,.quality,.form-grid,.workflow{grid-template-columns:1fr}.story.reverse .story-img{order:0}.trust{grid-template-columns:1fr 1fr}.search-results{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column;gap:8px}footer{grid-template-columns:1fr;padding-bottom:90px}.bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:70;left:10px;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(20,32,25,.18);padding:7px}.bottom-nav button,.bottom-nav a{border:0;background:none;padding:8px 4px;text-align:center;font-size:.75rem;font-weight:750}.bottom-nav b{display:block;font-size:1.15rem}.tool-box{padding:18px}body{padding-bottom:78px}}</style></head><body><header class="site-header" id="header"><a class="brand" href="#home">Werk<span>Rechner</span></a><nav id="nav"><a href="#tools">Tools</a><a href="#guides">Ratgeber</a><a href="#about">Über uns</a><a href="#contact">Kontakt</a><a href="#methodik">Methodik</a></nav><button class="menu-btn" id="menuBtn" aria-label="Menü öffnen">☰</button></header><main id="app"></main><footer><div><strong>WerkRechner</strong><p>Kostenlose digitale Werkzeuge für Handwerk, Baustelle und Renovierung.</p></div><div><a href="#tools">Tools</a><a href="#guides">Ratgeber</a><a href="#about">Über uns</a><a href="#contact">Kontakt</a><a href="#methodik">Methodik</a></div><div><a href="#impressum">Impressum</a><a href="#datenschutz">Datenschutz</a><a href="#privacy">Datenschutz-Einstellungen</a></div></footer><div class="bottom-nav"><a href="#home"><b>⌂</b>Start</a><a href="#tools"><b>▦</b>Tools</a><button id="searchOpen"><b>⌕</b>Suche</button><button id="favOpen"><b>★</b>Favoriten</button></div><div class="drawer" id="drawer"><div class="drawer-panel"><button class="btn secondary" id="drawerClose">Schließen</button><div id="drawerBody"></div></div></div><script>const IMG='https://raw.githubusercontent.com/TimonGuldner/Timong/244a32dd95a2ca1f6a0ed7dd932104381fd76422/werkrechner-preview/images/';const tools=[['abnahmeprotokoll-generator','Abnahmeprotokoll-Generator','Dokumentation','doc','Abnahme, Restarbeiten und Mängel strukturiert festhalten.'],['anfahrtskosten-rechner','Anfahrtskosten-Rechner','Betrieb & Kalkulation','travel','Fahrtkosten und bezahlte Fahrzeit kalkulieren.'],['angebotskalkulator','Angebotskalkulator','Betrieb & Kalkulation','quote','Arbeitszeit, Material, Anfahrt und MwSt. zusammenführen.'],['aufmass-rechner','Aufmaß-Rechner','Baustelle','measure','Flächen für einfache Positionen direkt berechnen.'],['baustellenbericht-generator','Baustellenbericht-Generator','Baustelle','doc','Fortschritt, Personal und offene Punkte dokumentieren.'],['bautagesbericht-generator','Bautagesbericht-Generator','Baustelle','doc','Wetter, Personal, Arbeiten und Behinderungen dokumentieren.'],['betonrechner','Betonrechner','Material & Mengen','concrete','Betonvolumen plus frei wählbare Reserve berechnen.'],['dachflaechen-rechner','Dachflächen-Rechner','Material & Mengen','roofarea','Geneigte Dachfläche eines einfachen Satteldachs berechnen.'],['dachneigungs-rechner','Dachneigungs-Rechner','Material & Mengen','roofpitch','Dachneigung aus Höhe und horizontaler Strecke berechnen.'],['deckungsbeitrag-rechner','Deckungsbeitrag-Rechner','Betrieb & Kalkulation','contribution','Deckungsbeitrag und Quote eines Auftrags ermitteln.'],['estrichrechner','Estrichrechner','Material & Mengen','screed','Estrichvolumen und grobe Materialmasse berechnen.'],['farbverbrauch-rechner','Farbverbrauch-Rechner','Renovierung','paint','Liter Farbe aus Fläche, Anstrichen und Ergiebigkeit berechnen.'],['fliesen-verschnitt-rechner','Fliesen-Verschnitt-Rechner','Material & Mengen','waste','Bestellfläche und Reserve für Fliesen berechnen.'],['fliesenrechner','Fliesenrechner','Material & Mengen','tiles','Fliesenanzahl und Bestellfläche inklusive Reserve berechnen.'],['fugenmasse-rechner','Fugenmassen-Rechner','Material & Mengen','grout','Fugenvolumen aus Fläche, Format und Fugenmaßen schätzen.'],['maengelprotokoll-generator','Mängelprotokoll-Generator','Dokumentation','doc','Mängel mit Ort, Priorität, Frist und Zuständigkeit erfassen.'],['materialaufschlag-rechner','Materialaufschlag-Rechner','Betrieb & Kalkulation','markup','Aufschlag und Handelsspanne berechnen.'],['materialkosten-rechner','Materialkosten-Rechner','Betrieb & Kalkulation','material','Materialpreis mit Verschnitt, Aufschlag und MwSt. kalkulieren.'],['mitarbeiterkosten-rechner','Mitarbeiterkosten-Rechner','Betrieb & Kalkulation','employee','Arbeitgeberkosten aus Monatsbrutto und Faktor schätzen.'],['moertelrechner','Mörtelrechner','Material & Mengen','mortar','Mörtelvolumen aus Fläche und Schichtdicke berechnen.'],['projektkosten-rechner','Projektkosten-Rechner','Betrieb & Kalkulation','project','Projektkosten bündeln und Zielverkaufspreis ableiten.'],['rapportzettel-generator','Rapportzettel-Generator','Dokumentation','doc','Leistungen, Stunden und Material sauber dokumentieren.'],['regiebericht-generator','Regiebericht-Generator','Dokumentation','doc','Regiearbeiten mit Zeiten, Material und Beschreibung erfassen.'],['stundenverrechnungssatz-rechner','Stundenverrechnungssatz-Rechner','Betrieb & Kalkulation','hourly','Kostendeckenden Verrechnungssatz berechnen.'],['stundenzettel-rechner','Stundenzettel-Rechner','Dokumentation','timesheet','Nettoarbeitszeit aus Beginn, Ende und Pause berechnen.'],['tapetenrechner','Tapetenrechner','Renovierung','wallpaper','Tapetenrollen aus Umfang, Höhe und Rollenmaßen berechnen.'],['terrassenmaterial-rechner','Terrassenmaterial-Rechner','Renovierung','decking','Dielenbedarf aus Fläche, Breite, Fuge und Reserve schätzen.'],['wandflaechen-rechner','Wandflächen-Rechner','Renovierung','walls','Wandfläche eines Raums abzüglich Öffnungen berechnen.']].map(x=>({slug:x[0],title:x[1],cat:x[2],kind:x[3],desc:x[4]}));const app=document.getElementById('app');const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);const num=(n,d=2)=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:d}).format(Number(n)||0);const N=id=>parseFloat(document.getElementById(id)?.value)||0,V=id=>document.getElementById(id)?.value||'';const field=(id,label,val,type='number')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${val}"></div>`;function toolCard(t){return `<a class="card" href="#tool/${t.slug}"><span class="pill">${t.cat}</span><h3>${t.title}</h3><p class="muted">${t.desc}</p><strong>Öffnen →</strong></a>`}function searchBox(){return `<section class="search-panel"><div class="section-head"><div><span class="eyebrow">Schnell finden</span><h2>Was möchtest du erledigen?</h2></div><p>Suche nach Aufgabe, Material oder Dokument.</p></div><div class="search-wrap"><input id="toolSearch" placeholder="z. B. Stundensatz, Fliesen, Beton, Rapport …"></div><div class="search-results" id="searchResults"></div></section>`}function bindSearch(){const i=document.getElementById('toolSearch'),r=document.getElementById('searchResults');if(!i||!r)return;const draw=()=>{const q=i.value.toLowerCase().trim(),found=tools.filter(t=>!q||(t.title+' '+t.cat+' '+t.desc).toLowerCase().includes(q)).slice(0,8);r.innerHTML=found.map(t=>`<a class="search-item" href="#tool/${t.slug}"><span><strong>${t.title}</strong><small>${t.cat}</small></span><b>→</b></a>`).join('')||'<div class="empty">Kein passendes Tool gefunden.</div>'};i.oninput=draw;draw()}function home(){return `<section class="hero"><div><span class="eyebrow">Für Handwerker, kleine Betriebe & Baustelle</span><h1>Weniger Zettel. Weniger Überschlagen. Mehr Klarheit bei jedem Auftrag.</h1><p>WerkRechner bündelt wiederkehrende Aufgaben aus Kalkulation, Materialplanung, Baustellendokumentation und Renovierung in kostenlosen, verständlichen Werkzeugen – ohne Anmeldung und ohne komplizierte Software.</p><div class="btn-row"><a class="btn" href="#tools">Passendes Tool finden</a><a class="btn secondary" href="#tool/stundenverrechnungssatz-rechner">Stundensatz berechnen</a></div></div><figure class="hero-visual"><img src="${IMG}hero.webp" alt="Handwerker nutzt Tablet für Kalkulation und Planung"></figure></section>${searchBox()}<section class="trust"><div><strong>28</strong><span>aktive Rechner & Generatoren</span></div><div><strong>5</strong><span>Werkzeugbereiche</span></div><div><strong>0 €</strong><span>für Kernfunktionen</span></div><div><strong>1 Ziel</strong><span>schneller zur Entscheidung</span></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">Typische Aufgaben</span><h2>Starte bei dem Problem, das gerade vor dir liegt.</h2></div><p>Keine komplizierte Software-Struktur: Aufgabe wählen, Werte eingeben, Ergebnis prüfen und sinnvoll weiterarbeiten.</p></div><div class="grid"><a class="card" href="#tool/stundenverrechnungssatz-rechner"><h3>Was muss ich pro Stunde verlangen?</h3><p class="muted">Produktive Stunden, Gemeinkosten und Gewinn zusammenführen.</p></a><a class="card" href="#tool/fliesenrechner"><h3>Wie viel Material brauche ich?</h3><p class="muted">Nettofläche, Reserve, Stückzahl und Bestellmenge sauber trennen.</p></a><a class="card" href="#tool/bautagesbericht-generator"><h3>Was war heute auf der Baustelle?</h3><p class="muted">Personal, Leistungen, Lieferungen und Besonderheiten dokumentieren.</p></a></div></section><section class="story"><div class="story-img"><img src="${IMG}kalkulation.webp" alt="Kalkulation im Handwerk"></div><div><span class="eyebrow">Kalkulation</span><h2>Von Mitarbeiterkosten bis Angebot.</h2><p class="muted">WerkRechner hält Kostenbausteine getrennt und nachvollziehbar. Dadurch erkennst du, welche Annahme ein Ergebnis verändert – statt nur eine fertige Zahl aus einer Blackbox zu bekommen.</p><a class="btn" href="#tools">Kalkulations-Tools öffnen</a></div></section><section class="story reverse"><div class="story-img"><img src="${IMG}material.webp" alt="Material- und Mengenplanung"></div><div><span class="eyebrow">Material & Mengen</span><h2>Erst sauber messen, dann sinnvoll bestellen.</h2><p class="muted">Fliesen, Beton, Estrich, Mörtel, Farbe oder Tapete: Die Rechner trennen Netto-Menge, Reserve und Ergebnis und weisen darauf hin, wann Herstellerangaben Vorrang haben.</p><a class="btn" href="#tool/fliesenrechner">Fliesenbedarf berechnen</a></div></section><section class="story"><div class="story-img"><img src="${IMG}baustelle.webp" alt="Baustellendokumentation"></div><div><span class="eyebrow">Baustelle</span><h2>Was heute passiert, sollte morgen noch nachvollziehbar sein.</h2><p class="muted">Bautagesbericht, Rapport, Aufmaß, Regie- und Mängelprotokoll helfen dabei, Informationen vollständig und druckbar festzuhalten.</p><a class="btn" href="#tool/bautagesbericht-generator">Bautagesbericht starten</a></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">Werkzeugketten</span><h2>Ein Ergebnis wird zum nächsten Arbeitsschritt.</h2></div></div><div class="workflow"><a class="card" href="#tool/mitarbeiterkosten-rechner"><span>1</span><h3>Angebot</h3><p>Mitarbeiterkosten → Stundensatz → Material → Angebot → Deckungsbeitrag</p></a><a class="card" href="#tool/aufmass-rechner"><span>2</span><h3>Fliesenprojekt</h3><p>Aufmaß → Fliesen → Verschnitt → Fugenmasse → Materialkosten</p></a><a class="card" href="#tool/wandflaechen-rechner"><span>3</span><h3>Renovierung</h3><p>Wandfläche → Farbe/Tapete → Materialkosten → Projektkosten</p></a><a class="card" href="#tool/bautagesbericht-generator"><span>4</span><h3>Dokumentation</h3><p>Bautagesbericht → Rapport → Aufmaß → Abnahme/Mängel</p></a></div></section><section class="section quality"><div><span class="eyebrow">Transparenz</span><h2>Keine Blackbox: Formel, Beispiel und Grenzen gehören zum Tool.</h2><p>WerkRechner erklärt Rechenweg, typische Fehler und Grenzen. Hersteller-, Vertrags-, Norm- und Rechtsvorgaben haben Vorrang, wenn sie für das konkrete Projekt gelten.</p><a class="btn secondary" href="#methodik">Methodik ansehen</a></div><div class="quality-list"><div>✓ Eingaben selbst festlegen</div><div>✓ Rechenweg nachvollziehen</div><div>✓ Grenzen prüfen</div><div>✓ Mit passendem Tool weiterarbeiten</div></div></section>`}function fields(k){if(k==='hourly')return field('wage','Bruttolohn pro Stunde (€)',22)+field('factor','Arbeitgeberfaktor',1.28)+field('productive','Produktive Stunden/Jahr',1350)+field('overhead','Gemeinkosten/Jahr (€)',42000)+field('profit','Gewinnaufschlag (%)',12);if(k==='employee')return field('gross','Monatsbrutto (€)',3500)+field('factor','Arbeitgeberfaktor',1.25);if(k==='material')return field('buy','Einkaufspreis (€)',800)+field('waste','Verschnitt (%)',10)+field('markup','Materialaufschlag (%)',20)+field('vat','MwSt. (%)',19);if(k==='markup')return field('buy','Einkaufspreis (€)',100)+field('sell','Verkaufspreis (€)',140);if(k==='travel')return field('km','Strecke gesamt (km)',40)+field('cpk','Kosten je km (€)',0.55)+field('time','Fahrzeit (Stunden)',1)+field('rate','Verrechnungssatz Fahrzeit (€)',55);if(k==='contribution')return field('revenue','Umsatz (€)',5000)+field('variable','Variable Kosten (€)',3200);if(k==='quote')return field('hours','Arbeitsstunden',16)+field('rate','Stundensatz (€)',72)+field('material','Material EK (€)',900)+field('markup','Materialaufschlag (%)',20)+field('travel','Anfahrt (€)',80)+field('vat','MwSt. (%)',19);if(k==='project')return field('labor','Personal (€)',3000)+field('material','Material (€)',2500)+field('equipment','Geräte (€)',400)+field('travel','Fahrt (€)',150)+field('other','Sonstiges (€)',250)+field('margin','Zielmarge (%)',15);if(k==='measure')return field('length','Länge (m)',5)+field('width','Breite (m)',3)+field('qty','Anzahl',1);if(k==='timesheet')return field('start','Beginn','08:00','time')+field('end','Ende','16:30','time')+field('break','Pause (Min.)',30);if(k==='tiles')return field('area','Fläche (m²)',25)+field('tw','Fliesenbreite (cm)',60)+field('th','Fliesenhöhe (cm)',60)+field('waste','Reserve (%)',10);if(k==='waste')return field('area','Nettofläche (m²)',25)+field('waste','Reserve (%)',10);if(k==='paint')return field('area','Fläche (m²)',60)+field('coats','Anstriche',2)+field('coverage','Ergiebigkeit (m²/L)',8);if(k==='walls')return field('length','Raumlänge (m)',5)+field('width','Raumbreite (m)',4)+field('height','Raumhöhe (m)',2.5)+field('openings','Fenster/Türen (m²)',5);if(k==='concrete')return field('length','Länge (m)',5)+field('width','Breite (m)',3)+field('height','Höhe/Dicke (m)',0.2)+field('reserve','Reserve (%)',5);if(k==='screed')return field('area','Fläche (m²)',40)+field('thickness','Dicke (mm)',55)+field('density','Dichte grob (kg/m³)',2000);if(k==='mortar')return field('area','Fläche (m²)',30)+field('thickness','Schichtdicke (mm)',12);if(k==='grout')return field('area','Fläche (m²)',25)+field('tilel','Fliesenlänge (mm)',600)+field('tilew','Fliesenbreite (mm)',600)+field('joint','Fugenbreite (mm)',3)+field('depth','Fugentiefe (mm)',8);if(k==='wallpaper')return field('perimeter','Raumumfang (m)',18)+field('height','Raumhöhe (m)',2.5)+field('rollw','Rollenbreite (cm)',53)+field('rolllen','Rollenlänge (m)',10.05)+field('extra','Zugabe je Bahn (cm)',10);if(k==='roofarea')return field('footprint','Horizontale Grundfläche (m²)',100)+field('pitch','Dachneigung (°)',35);if(k==='roofpitch')return field('rise','Höhenunterschied (m)',3)+field('run','Horizontale Strecke (m)',5);if(k==='decking')return field('area','Terrassenfläche (m²)',25)+field('boardw','Dielenbreite (mm)',145)+field('gap','Fugenbreite (mm)',5)+field('waste','Reserve (%)',8);return `<div class="field"><label>Kunde / Projekt</label><input id="d1" value="Musterkunde"></div><div class="field"><label>Datum</label><input id="d2" type="date"></div><div class="field" style="grid-column:1/-1"><label>Beschreibung / Leistungen</label><textarea id="d3">Ausgeführte Arbeiten und Besonderheiten dokumentieren.</textarea></div>`}function calc(k){let rows=[],big='';if(k==='hourly'){let c=N('wage')*N('factor')*N('productive')+N('overhead'),base=c/N('productive'),rate=base*(1+N('profit')/100);rows=[['Jahreskosten',eur(c)],['Kostensatz',eur(base)],['Verrechnungssatz',eur(rate)]];big=eur(rate)+'/h'}else if(k==='employee'){let m=N('gross')*N('factor');rows=[['Arbeitgeberkosten/Monat',eur(m)],['Arbeitgeberkosten/Jahr',eur(m*12)]];big=eur(m)+'/Monat'}else if(k==='material'){let net=N('buy')*(1+N('waste')/100)*(1+N('markup')/100),gross=net*(1+N('vat')/100);rows=[['Verkauf netto',eur(net)],['Verkauf brutto',eur(gross)]];big=eur(gross)}else if(k==='markup'){let bu=N('buy'),se=N('sell');rows=[['Aufschlag',num(bu?(se-bu)/bu*100:0,1)+' %'],['Handelsspanne',num(se?(se-bu)/se*100:0,1)+' %']];big=rows[0][1]}else if(k==='travel'){let t=N('km')*N('cpk')+N('time')*N('rate');rows=[['Fahrzeug',eur(N('km')*N('cpk'))],['Fahrzeit',eur(N('time')*N('rate'))],['Gesamt',eur(t)]];big=eur(t)}else if(k==='contribution'){let d=N('revenue')-N('variable');rows=[['Deckungsbeitrag',eur(d)],['Quote',num(N('revenue')?d/N('revenue')*100:0,1)+' %']];big=eur(d)}else if(k==='quote'){let labor=N('hours')*N('rate'),mat=N('material')*(1+N('markup')/100),net=labor+mat+N('travel'),gross=net*(1+N('vat')/100);rows=[['Arbeit',eur(labor)],['Material',eur(mat)],['Netto',eur(net)],['Brutto',eur(gross)]];big=eur(gross)}else if(k==='project'){let c=N('labor')+N('material')+N('equipment')+N('travel')+N('other'),m=N('margin')/100,p=m<1?c/(1-m):0;rows=[['Gesamtkosten',eur(c)],['Zielverkauf',eur(p)],['Zielertrag',eur(p-c)]];big=eur(p)}else if(k==='measure'){let a=N('length')*N('width')*Math.max(1,N('qty'));rows=[['Gesamtfläche',num(a)+' m²']];big=rows[0][1]}else if(k==='timesheet'){let a=V('start').split(':'),z=V('end').split(':'),mins=Math.max(0,(+z[0]*60+(+z[1]||0))-(+a[0]*60+(+a[1]||0))-N('break'));rows=[['Nettoarbeitszeit',num(mins/60)+' h']];big=rows[0][1]}else if(k==='tiles'){let order=N('area')*(1+N('waste')/100),piece=(N('tw')/100)*(N('th')/100),qty=Math.ceil(order/piece);rows=[['Bestellfläche',num(order)+' m²'],['Fliesenanzahl',num(qty,0)+' Stück']];big=num(order)+' m²'}else if(k==='waste'){let order=N('area')*(1+N('waste')/100);rows=[['Bestellfläche',num(order)+' m²']];big=rows[0][1]}else if(k==='paint'){let l=N('area')*N('coats')/N('coverage');rows=[['Farbbedarf',num(l)+' L']];big=rows[0][1]}else if(k==='walls'){let a=(N('length')+N('width'))*2*N('height')-N('openings');rows=[['Netto-Wandfläche',num(Math.max(0,a))+' m²']];big=rows[0][1]}else if(k==='concrete'){let v=N('length')*N('width')*N('height')*(1+N('reserve')/100);rows=[['Betonmenge',num(v)+' m³']];big=rows[0][1]}else if(k==='screed'){let v=N('area')*N('thickness')/1000,m=v*N('density');rows=[['Volumen',num(v)+' m³'],['Grobe Masse',num(m,0)+' kg']];big=num(v)+' m³'}else i </div>`}function privacy(){return `<div class="legal-main"><div class="breadcrumbs"><a href="#home">Start</a> / Datenschutz-Einstellungen</div><h1>Datenschutz-Einstellungen</h1><section class="content-box"><h2>Lokale Favoriten</h2><p>Du kannst alle lokal gespeicherten WerkRechner-Favoriten löschen.</p><button class="btn secondary" onclick="localStorage.removeItem('wrFav');alert('Lokale Favoriten wurden gelöscht.')">Favoriten löschen</button><h2>Werbung</h2><p>In dieser Vorschau werden keine AdSense-Anzeigen ausgeliefert.</p></section></div>`}function render(){const h=location.hash.slice(1)||'home';if(h==='home')app.innerHTML=home();else if(h==='tools')app.innerHTML=toolsPage();else if(h==='guides')app.innerHTML=guides();else if(h.startsWith('tool/'))app.innerHTML=toolPage(h.slice(5));else if(h.startsWith('guide/'))app.innerHTML=guide(h.slice(6));else if(h==='about')app.innerHTML=about();else if(h==='methodik')app.innerHTML=methodik();else if(h==='contact')app.innerHTML=contact();else if(h==='impressum')app.innerHTML=impressum();else if(h==='datenschutz')app.innerHTML=datenschutz();else if(h==='privacy')app.innerHTML=privacy();else app.innerHTML=home();bindSearch();const slug=h.startsWith('tool/')?h.slice(5):null;if(slug){const go=document.getElementById('go'),t=tools.find(x=>x.slug===slug);if(go&&t)go.onclick=()=>calc(t.kind);const fb=document.getElementById('favBtn');if(fb){const list=JSON.parse(localStorage.getItem('wrFav')||'[]');fb.textContent=list.includes(slug)?'★ Favorit':'☆ Favorit';fb.onclick=()=>{let x=JSON.parse(localStorage.getItem('wrFav')||'[]');x=x.includes(slug)?x.filter(y=>y!==slug):[slug,...x];localStorage.setItem('wrFav',JSON.stringify(x));fb.textContent=x.includes(slug)?'★ Favorit':'☆ Favorit'}}}document.getElementById('header').classList.remove('open');window.scrollTo(0,0)}addEventListener('hashchange',render);document.getElementById('menuBtn').onclick=()=>document.getElementById('header').classList.toggle('open');document.getElementById('nav').onclick=()=>document.getElementById('header').classList.remove('open');const drawer=document.getElementById('drawer'),body=document.getElementById('drawerBody');document.getElementById('drawerClose').onclick=()=>drawer.classList.remove('open');document.getElementById('searchOpen').onclick=()=>{body.innerHTML=`<h2>Tool suchen</h2>${searchBox()}`;drawer.classList.add('open');bindSearch()};document.getElementById('favOpen').onclick=()=>{const fav=JSON.parse(localStorage.getItem('wrFav')||'[]'),items=fav.map(s=>tools.find(t=>t.slug===s)).filter(Boolean);body.innerHTML=`<h2>Meine Werkzeuge</h2>${items.length?`<div class="grid">${items.map(toolCard).join('')}</div>`:'<div class="empty">Noch keine Favoriten gespeichert.</div>'}`;drawer.classList.add('open')};drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};render();</script></body></html>
