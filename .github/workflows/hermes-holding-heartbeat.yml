name: Hermes Holding Hourly Heartbeat

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/hermes-holding-heartbeat.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: hermes-holding-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout holding workspace
        uses: actions/checkout@v4

      - name: Fetch authenticated holding snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p holding-runtime/runtime holding-runtime/work
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hermes-holding")
          OIDC_TOKEN=$(printf '%s' "$OIDC_JSON" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          curl -fsSL \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://lzqybaxpgwkqyysluivg.supabase.co/functions/v1/hh-hermes-broker/snapshot" \
            -o holding-runtime/runtime/snapshot.json
          jq -e '.autonomy.max_spend_eur == 0 and (.businesses|type=="array") and (.experiments|type=="array")' holding-runtime/runtime/snapshot.json >/dev/null

      - name: Build CEO heartbeat prompt
        shell: bash
        run: |
          set -euo pipefail
          cp holding-runtime/CEO_PROMPT.md holding-runtime/runtime/run_prompt.txt
          {
            echo
            echo '--- PERSISTENT MEMORY ---'
            cat holding-runtime/memory/MEMORY.md
            echo
            echo '--- LIVE HOLDING SNAPSHOT ---'
            jq . holding-runtime/runtime/snapshot.json
          } >> holding-runtime/runtime/run_prompt.txt

      - name: Pull Hermes Agent runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull nousresearch/hermes-agent:latest

      - name: Run autonomous Hermes CEO through live free pool
        id: hermes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-home"
          PROMPT=$(cat holding-runtime/runtime/run_prompt.txt)

          curl -fsSL --max-time 10 https://opencode.ai/zen/v1/models -o holding-runtime/runtime/opencode-models.json || true
          mapfile -t LIVE_FREE < <(jq -r '.data[]?.id | select(endswith("-free"))' holding-runtime/runtime/opencode-models.json 2>/dev/null || true)
          PREFERRED=("mimo-v2.5-free" "hy3-free" "ling-3.0-tiny-free" "laguna-s-2.1-free" "nemotron-3.5-lightning-free" "nemotron-3-ultra-free" "deepseek-v4-flash-free")

          MODELS=()
          for m in "${PREFERRED[@]}" "${LIVE_FREE[@]}"; do
            [ -n "$m" ] || continue
            seen=false
            for x in "${MODELS[@]}"; do [ "$x" = "$m" ] && seen=true && break; done
            [ "$seen" = true ] || MODELS+=("$m")
          done

          VALID=false
          rm -f /tmp/hermes-result.json /tmp/hermes-usage.json /tmp/hermes-model.txt

          for MODEL in "${MODELS[@]}"; do
            echo "Trying zero-cost Hermes model: $MODEL"
            rm -f holding-runtime/runtime/raw.txt holding-runtime/runtime/result.json holding-runtime/runtime/usage.json holding-runtime/runtime/hermes-stderr.txt
            timeout --signal=TERM --kill-after=5s 30s docker run --rm \
              -v "$PWD:/workspace" \
              -v "$RUNNER_TEMP/hermes-home:/opt/data" \
              -w /workspace \
              nousresearch/hermes-agent:latest \
              -z "$PROMPT" \
              --provider opencode-free \
              --model "$MODEL" \
              --usage-file /workspace/holding-runtime/runtime/usage.json \
              --yolo \
              > holding-runtime/runtime/raw.txt 2> holding-runtime/runtime/hermes-stderr.txt || true

            python3 holding-runtime/normalize_result.py holding-runtime/runtime/raw.txt holding-runtime/runtime/result.json >/dev/null || true
            if python3 - <<'PY'
          import json, sys
          from pathlib import Path
          try:
              o=json.loads(Path('holding-runtime/runtime/result.json').read_text(encoding='utf-8'))
          except Exception:
              sys.exit(1)
          invalid={
              'Hermes returned non-JSON output; no autonomous decision was accepted.',
              'No currently available zero-cost Hermes model produced a valid CEO result.'
          }
          valid=o.get('summary') not in invalid and o.get('status') in ('SUCCEEDED','BLOCKED') and isinstance(o.get('actions'),list)
          sys.exit(0 if valid else 1)
          PY
            then
              VALID=true
              cp holding-runtime/runtime/result.json /tmp/hermes-result.json
              if [ -f holding-runtime/runtime/usage.json ]; then cp holding-runtime/runtime/usage.json /tmp/hermes-usage.json; else echo '{}' >/tmp/hermes-usage.json; fi
              printf '%s\n' "$MODEL" >/tmp/hermes-model.txt
              echo "Accepted valid CEO result from $MODEL"
              break
            else
              echo "Model $MODEL failed or timed out; trying next free model."
            fi
          done

          if [ "$VALID" != "true" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          err=Path('holding-runtime/runtime/hermes-stderr.txt').read_text(errors='replace')[-1600:] if Path('holding-runtime/runtime/hermes-stderr.txt').exists() else 'No free model produced a valid result.'
          obj={'status':'BLOCKED','summary':'No currently available zero-cost Hermes model produced a valid CEO result.','decision':None,'learning':None,'actions':[{'type':'NOOP','description':'Heartbeat exhausted the live free-model pool and failed safely without paid fallback.','artifact':None,'requires_owner':False}],'next_heartbeat_focus':'Retry the refreshed zero-cost model catalogue on the next scheduled heartbeat.','runtime_error':err}
          Path('/tmp/hermes-result.json').write_text(json.dumps(obj),encoding='utf-8')
          Path('/tmp/hermes-usage.json').write_text('{}',encoding='utf-8')
          Path('/tmp/hermes-model.txt').write_text('free-pool-exhausted\n',encoding='utf-8')
          PY
          fi
          echo "valid=$VALID" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate accepted CEO result
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status and .summary and (.actions|type=="array")' /tmp/hermes-result.json >/dev/null
          cat /tmp/hermes-result.json

      - name: Enforce write sandbox
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          allowed=('holding-runtime/work/','holding-runtime/memory/')
          out=subprocess.check_output(['git','status','--porcelain','-z'])
          for raw in out.split(b'\0'):
              if not raw: continue
              s=raw.decode('utf-8','replace'); path=s[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              if path.startswith(allowed): continue
              p=Path(path)
              tracked=subprocess.run(['git','ls-files','--error-unmatch','--',path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if tracked: subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','--',path],check=False)
              elif p.exists(): shutil.rmtree(p) if p.is_dir() else p.unlink()
          PY
          rm -rf holding-runtime/runtime

      - name: Persist safe Hermes artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add holding-runtime/work holding-runtime/memory 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "Hermes Holding CEO"
            git config user.email "hermes-holding@users.noreply.github.com"
            git commit -m "hermes: persist hourly holding learning"
            git push
          else
            echo "No safe persistent artifact changes this heartbeat."
          fi

      - name: Build authenticated report payload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermes-report
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/hermes-result.json')
          result=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'BLOCKED','summary':'Heartbeat failed before a validated result was available.','decision':None,'learning':None,'actions':[{'type':'NOOP','description':'Runtime failed safely.','artifact':None,'requires_owner':False}],'next_heartbeat_focus':'Retry next heartbeat.'}
          try: usage=json.loads(Path('/tmp/hermes-usage.json').read_text(encoding='utf-8')) if Path('/tmp/hermes-usage.json').exists() else {}
          except Exception: usage={}
          model=Path('/tmp/hermes-model.txt').read_text().strip() if Path('/tmp/hermes-model.txt').exists() else 'unknown-free-model'
          usage.setdefault('provider','opencode-free'); usage.setdefault('model',model); usage.setdefault('estimated_cost_usd',0)
          payload={'success':'${{ steps.hermes.outputs.valid }}'=='true','provider':'opencode-free','model':model,'result':result,'usage':usage}
          Path('/tmp/hermes-report/report.json').write_text(json.dumps(payload),encoding='utf-8')
          PY

      - name: Record heartbeat in Supabase
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hermes-holding")
          OIDC_TOKEN=$(printf '%s' "$OIDC_JSON" | jq -r '.value')
          echo "::add-mask::$OIDC_TOKEN"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/hermes-report/report.json \
            "https://lzqybaxpgwkqyysluivg.supabase.co/functions/v1/hh-hermes-broker/report" \
            | jq .
